    egern: { support: native }
    quantumultx: { support: compatible }

- id: kelee
  name: KeLee
  repo: luestr/ShuntRules
  tier: C
  type: special
  enabled: true
  homepage: https://rule.kelee.one
  author: KeLee
  license: unknown
  validation:
    mode: special
  url:
    mode: base
    base: https://rule.kelee.one
  scan:
    mode: kelee_catalog
  catalog_url: https://raw.githubusercontent.com/luestr/ShuntRules/master/README.md
  clients:
    loon:
      support: native
      url_pattern: https://rule.kelee.one/Loon/{name}.lsr
      format: loon_ruleset
    mihomo:
      support: native
      url_pattern: https://rule.kelee.one/Clash/{name}.yaml
      format: clash_ruleset

