# 服务别名配置 (Service Aliases / Canonical Service Catalog)
#
# 定义稳定的 canonical service ID、名称、别名与分类。
# APP 名称大小写变化、文件名变化都不能导致生成新的 APP。
# 搜索别名时仍然命中 canonical APP。
#
# 字段:
#   id       canonical 服务 ID (稳定)
#   name     展示名称
#   aliases  搜索别名 (ChatGPT -> OpenAI, Twitter -> X, TG -> Telegram)
#   category 分类 (用于搜索筛选)
#
# 未收录于此文件的服务: 若 sources.yaml 中该 source 设置了
# enabled_dynamic_services: true, 扫描器会为其创建动态服务条目并记录在
# reports/dynamic-services.txt, 方便日后人工决定是否转正。

services:
