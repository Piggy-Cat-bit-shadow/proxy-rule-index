# 以下为 provider 专属文件名 -> canonical service id 的映射。
# 键: "<provider_id>:<文件名(不含扩展名和变体)>"
# 值: canonical service id
#
# 目的: 解决不同仓库对同一服务使用不同文件名的问题 (例如 Repcz 的 Twitter.list -> x)。
# 未列出的文件名: 扫描器会尝试直接按名称匹配上面的 services 列表;
# 仍不匹配且 source 允许动态服务时, 会创建动态服务条目。
provider_file_mapping:
  repcz:
    Twitter: x
    Github: github
    OpenAI: openai
    AppleCN: apple-cn
    AppleProxy: apple-proxy
    AppleMedia: apple-media
    DownloadCDN_CN: downloadcdn-cn
    DownloadCDN_Global: downloadcdn
    FILTER_REGION: filter-region
    Prevent_DNS_Leaks: prevent-dns-leaks
    ProxyGFW: proxy-gfw
    ProxyMedia: proxymedia
    ChinaDomain: china-domain
    ChinaIP: china-ip
    ChinaASN: china-asn
    TestFlight: testflight
