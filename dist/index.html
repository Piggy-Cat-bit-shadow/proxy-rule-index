<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule Index — 代理规则搜索</title>
<style>
:root {
  --bg: #0f1117;
  --card: #171a23;
  --card2: #1d2130;
  --border: #2a2f3e;
  --text: #e6e8ee;
  --muted: #8b91a3;
  --accent: #4f8cff;
  --green: #3ecf8e;
  --amber: #f5a623;
  --red: #ff5d5d;
  --purple: #b07cff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
header {
  padding: 32px 24px 20px; max-width: 880px; margin: 0 auto;
}
header h1 { font-size: 22px; letter-spacing: 0.5px; }
header p { color: var(--muted); font-size: 13px; margin-top: 6px; }
.clients {
  display: flex; gap: 10px; flex-wrap: wrap;
  padding: 16px 24px; max-width: 880px; margin: 0 auto;
}
.client-btn {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer;
  transition: all 0.15s;
}
.client-btn:hover { border-color: var(--accent); }
.client-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.search-wrap { max-width: 880px; margin: 8px auto 0; padding: 0 24px; }
.search-wrap input {
  width: 100%; padding: 14px 18px; border-radius: 12px;
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  font-size: 16px; outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
main { max-width: 880px; margin: 24px auto 60px; padding: 0 24px; }
.svc-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.svc-sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.rec {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 12px;
}
.rec-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rec-provider { font-size: 15px; font-weight: 600; }
.rec-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag {
  font-size: 11px; padding: 3px 8px; border-radius: 20px;
  background: var(--card2); border: 1px solid var(--border); color: var(--muted);
}
.tag.client { color: var(--accent); border-color: var(--accent); }
.tag.gran { background: rgba(79,140,255,0.12); color: var(--accent); border-color: transparent; }
.tag.native { background: rgba(62,207,142,0.12); color: var(--green); border-color: transparent; }
.tag.compat { color: var(--muted); }
.rec-meta { color: var(--muted); font-size: 12.5px; margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
.status-avail { color: var(--green); font-weight: 600; }
.status-special { color: var(--purple); font-weight: 600; }
.status-warn { color: var(--amber); font-weight: 600; }
.status-unavail { color: var(--red); font-weight: 600; }
.rec-url {
  margin-top: 10px; font-size: 12px; color: var(--muted);
  word-break: break-all; padding: 8px 10px; background: var(--card2);
  border-radius: 8px; border: 1px solid var(--border);
}
.rec-url code { color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }
footer { color: var(--muted); font-size: 11px; text-align: center; padding: 24px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>🔎 Rule Index</h1>
  <p>先选择客户端，再搜索想要分流的 APP</p>
</header>

<div class="clients" id="clientRow"></div>
<div class="search-wrap">
  <input id="searchInput" type="text" placeholder="搜索 APP… 例如 Telegram / OpenAI / ChatGPT / YouTube / GitHub" autocomplete="off">
</div>
<main>
  <div id="result"></div>
</main>
<footer id="footer"></footer>

<script>
const CLIENTS = [
  { id: "surge", label: "Surge" },
  { id: "loon", label: "Loon" },
  { id: "shadowrocket", label: "Shadowrocket" },
  { id: "egern", label: "Egern" },
  { id: "mihomo", label: "Mihomo" },
  { id: "sing-box", label: "sing-box / Box" },
];

let catalog = [];
let services = [];
let stats = {};
let activeClient = "surge";
let query = "";

const clientRow = document.getElementById("clientRow");
CLIENTS.forEach(c => {
  const btn = document.createElement("button");
  btn.className = "client-btn" + (c.id === activeClient ? " active" : "");
  btn.textContent = c.label;
  btn.onclick = () => { activeClient = c.id; renderClients(); doSearch(); };
  clientRow.appendChild(btn);
});
function renderClients() {
  document.querySelectorAll(".client-btn").forEach((b, i) => {
    b.classList.toggle("active", CLIENTS[i].id === activeClient);
  });
}

const GRAN_LABEL = { app: "APP 专用", "service-family": "服务族", category: "分类规则", geo: "Geo", ads: "广告", global: "Global 兜底", special: "专项" };
const SUPPORT_LABEL = { native: "Native", compatible: "Compatible", converted: "Converted" };

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function statusHtml(status) {
  const map = {
    available: ['status-avail', '✅ 可用'],
    special: ['status-special', '🟣 特殊访问'],
    warning: ['status-warn', '⚠️ 警告'],
    unavailable: ['status-unavail', '❌ 不可用'],
  };
  const [cls, txt] = map[status] || ['', status];
  return `<span class="${cls}">${txt}</span>`;
}

function doSearch() {
  const q = query.trim().toLowerCase();
  const out = document.getElementById("result");
  if (!q) {
    out.innerHTML = '<div class="empty">输入 APP 名称开始搜索</div>';
    return;
  }
  // find matching services (name/aliases/id)
  const svcMatches = services.filter(s => {
    return s.name.toLowerCase().includes(q)
      || (s.aliases || []).some(a => a.toLowerCase().includes(q))
      || s.id.includes(q)
      || s.search_text.includes(q);
  });
  // exact match first, then alias, then substring
  svcMatches.sort((a, b) => {
    const ae = a.name.toLowerCase() === q ? 0 : (a.aliases || []).some(x => x.toLowerCase() === q) ? 1 : 2;
    const be = b.name.toLowerCase() === q ? 0 : (b.aliases || []).some(x => x.toLowerCase() === q) ? 1 : 2;
    return ae - be;
  });

  if (svcMatches.length === 0) {
    out.innerHTML = `<div class="empty">未找到与 “${esc(q)}” 相关的服务</div>`;
    return;
  }

  let html = "";
  for (const svc of svcMatches.slice(0, 8)) {
    // filter by client
    let recs = catalog.filter(r => r.service_id === svc.id && r.client === activeClient);
    if (recs.length === 0) continue;
    // sort: status > granularity > native > tier > freshness > count
    const granRank = { app: 0, "service-family": 1, category: 2, geo: 3, ads: 3, special: 3, global: 4 };
    const stRank = { available: 0, special: 0, warning: 1, unavailable: 2 };
    const nativeRank = { native: 0, compatible: 1, converted: 2 };
    const tierRank = { A: 0, B: 1, C: 2 };
    recs.sort((x, y) => {
      const g = (granRank[x.granularity] ?? 5) - (granRank[y.granularity] ?? 5);
      if (g) return g;
      const s = (stRank[x.status] ?? 3) - (stRank[y.status] ?? 3);
      if (s) return s;
      const n = (nativeRank[x.support] ?? 1) - (nativeRank[y.support] ?? 1);
      if (n) return n;
      const t = (tierRank[x.tier] ?? 3) - (tierRank[y.tier] ?? 3);
      if (t) return t;
      return (y.rule_count || 0) - (x.rule_count || 0);
    });

    html += `<div class="svc-title">${esc(svc.name)}</div>`;
    html += `<div class="svc-sub">${esc(svc.category)} · ${recs.length} 条规则 · ${esc(svc.id)}</div>`;
    for (const r of recs.slice(0, 10)) {
      const granTxt = GRAN_LABEL[r.granularity] || r.granularity;
      const suppTxt = SUPPORT_LABEL[r.support] || r.support;
      html += `
        <div class="rec">
          <div class="rec-top">
            <span class="rec-provider">${esc(r.provider)}</span>
            <span>${statusHtml(r.status)}</span>
          </div>
          <div class="rec-tags">
            <span class="tag client">${esc(r.client)}</span>
            <span class="tag gran">${esc(granTxt)}</span>
            <span class="tag ${r.support === 'native' ? 'native' : 'compat'}">${esc(suppTxt)}</span>
            <span class="tag">${r.rule_count != null ? r.rule_count + ' 条' : '— 条'}</span>
            ${r.rule_type_summary ? `<span class="tag">${esc(r.rule_type_summary)}</span>` : ''}
            <span class="tag">Tier ${esc(r.tier || '')}</span>
          </div>
          <div class="rec-meta">
            <span>来源: ${esc(r.repo)}</span>
            <span>验证: ${esc((r.last_checked_at || '').slice(0, 10))}</span>
          </div>
          <div class="rec-url"><code>${esc(r.url)}</code></div>
        </div>`;
    }
    html += "<br>";
  }
  if (!html) {
    out.innerHTML = `<div class="empty">“${esc(q)}” 暂无 ${esc(activeClient)} 客户端规则</div>`;
    return;
  }
  out.innerHTML = html;
}

document.getElementById("searchInput").addEventListener("input", e => { query = e.target.value; doSearch(); });

async function init() {
  try {
    const [c, s, st] = await Promise.all([
      fetch("catalog.json").then(r => r.json()),
      fetch("services.json").then(r => r.json()),
      fetch("stats.json").then(r => r.json()),
    ]);
    catalog = c; services = s; stats = st;
    const foot = document.getElementById("footer");
    foot.textContent = `${stats.total_rule_files || 0} 条规则 · ${stats.total_services || 0} 个服务 · 最后构建 ${(stats.generated_at || '').slice(0, 10)}`;
    document.getElementById("searchInput").placeholder = "搜索 APP… 例如 Telegram / OpenAI / ChatGPT / YouTube / GitHub";
  } catch (err) {
    document.getElementById("result").innerHTML = `<div class="empty">无法加载数据: ${esc(err.message)}</div>`;
  }
}
init();
</script>
</body>
</html>
