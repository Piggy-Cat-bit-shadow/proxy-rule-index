name: Update Rule Index

on:
  schedule:
    # 每天 06:17 UTC (约北京时间 14:17) 增量扫描
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - full-refresh
          - site-only
          - source
      source_id:
        description: "mode=source 时的来源 ID (如 repcz)"
        required: false
        default: ""
        type: string
      force_deploy:
        description: "强制重新构建站点并部署 (即使数据无变化)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: rule-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 数据层: 增量扫描 + 聚合。无变化时不触发后续 Site/Deploy。
  data:
    if: |
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, '[data]')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    permissions:
      contents: write  # 需要 commit generated data (dist/ generated/)
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.8.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.2.2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run incremental build
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RI_WORKERS: "16"
          RI_MODE: ${{ (inputs.mode == 'source' && (inputs.source_id != '' && format('source={0}', inputs.source_id) || 'auto')) || (inputs.mode || 'auto') }}
        run: |
          python3 -u scripts/build.py
          echo "data_hash=$(python3 -c "import json;print(json.load(open('dist/data/build-info.json'))['dataVersion'])" 2>/dev/null || echo 'error')" >> "$GITHUB_OUTPUT"

      - name: Validate outputs
        run: python3 scripts/validate.py

      - name: Configure git
        run: |
          git config user.name "rule-index-bot"
          git config user.email "rule-index-bot@users.noreply.github.com"

      - name: Commit and push (only if changed)
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'audit-only'
        run: |
          git add dist/ generated/
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
          else
            git commit -m "chore: update rule index [skip ci]" --no-verify
            git push origin HEAD
          fi

      - name: Upload data artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist-data
          path: dist/
          if-no-files-found: error

      - name: GitHub Actions summary
        run: |
          {
            echo "## Build Summary"
            echo ""
            python3 scripts/summary.py
            echo ""
            echo "data_hash: ${{ steps.build.outputs.data_hash }}"
            echo ""
            echo "dist size: $(du -sh dist 2>/dev/null | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare data hash and set flag
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ steps.build.outputs.data_hash }}"
          git show HEAD:dist/data/build-info.json 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin)['dataVersion'])" > /tmp/prev_hash.txt 2>/dev/null || echo "none" > /tmp/prev_hash.txt
          PREV=$(cat /tmp/prev_hash.txt)
          echo "current=$CURRENT prev=$PREV"
          if [ "$CURRENT" = "$PREV" ] && [ "${{ inputs.force_deploy }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data unchanged — skipping site build/deploy"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data changed or force_deploy — proceeding to site build/deploy"
          fi

  site:
    needs: data
    if: |
      needs.data.outputs.changed == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.mode != 'audit-only')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Download data artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.2.0
        with:
          name: dist-data
          path: dist/

      - name: Verify site assets
        run: |
          test -f dist/index.html && echo "index.html OK"
          test -f dist/data/manifest.json && echo "manifest OK"
          ls dist/data/catalog/ | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
